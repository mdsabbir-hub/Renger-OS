name: Unpack Zip Archive

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master
    paths:
      - '*.zip' # Triggers only when a zip file is pushed

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          # Finds the first zip file in the root directory and extracts it
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_temp
            
            # Move contents out of the temp folder to root (adjust folder structure if inside a wrapper folder)
            shopt -s dotglob
            mv extracted_temp/* ./
            rmdir extracted_temp
            
            # Remove the zip file from tracking/repository
            rm "$ZIP_FILE"
          else
            echo "No zip file found."
          fi

      - name: Commit and push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-unpacked zip file via GitHub Actions" || echo "No changes to commit"
          git push
